name: Bug report
description: Report a reproducible bug
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Version, placeholder: "e.g., v0.3.2" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1) … 2) … 3) …" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior (logs/trace) }
    validations: { required: true }
